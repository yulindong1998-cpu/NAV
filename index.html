<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Investor Accounting Dashboard</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f3f6fa;
    padding:20px;
}

h1{
    text-align:center;
    color:#1f4e79;
}

.container{
    max-width:1200px;
    margin:auto;
}

.filters{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

select{
    width:100%;
    padding:8px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.kpi{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.kpi h3{
    color:#666;
    margin-bottom:10px;
}

.kpi p{
    font-size:20px;
    color:#1f4e79;
    font-weight:bold;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
    background:white;
}

th{
    background:#1f4e79;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>Investor Accounting Dashboard</h1>

<div class="filters">

<div class="card">
<label>Investor</label>
<select id="investor"></select>
</div>

<div class="card">
<label>Commitment</label>
<select id="commitment"></select>
</div>

<div class="card">
<label>Contribution</label>
<select id="contribution"></select>
</div>

<div class="card">
<label>Distribution</label>
<select id="distribution"></select>
</div>

<div class="card">
<label>Net Investment Income/Loss</label>
<select id="nii"></select>
</div>

<div class="card">
<label>Ending Balance</label>
<select id="endingBalance"></select>
</div>

</div>

<div class="kpis">

<div class="kpi">
<h3>Commitment</h3>
<p id="kpiCommitment"></p>
</div>

<div class="kpi">
<h3>Contribution</h3>
<p id="kpiContribution"></p>
</div>

<div class="kpi">
<h3>Distribution</h3>
<p id="kpiDistribution"></p>
</div>

<div class="kpi">
<h3>NII</h3>
<p id="kpiNII"></p>
</div>

<div class="kpi">
<h3>Ending Balance</h3>
<p id="kpiEnding"></p>
</div>

</div>

<table>
<thead>
<tr>
<th>Investor</th>
<th>Commitment</th>
<th>Contribution</th>
<th>Distribution</th>
<th>NII</th>
<th>Ending Balance</th>
</tr>
</thead>
<tbody id="tableData"></tbody>
</table>

</div>

<script>

const investors = [
{
name:"Investor A",
commitment:1000000,
contribution:750000,
distribution:120000,
nii:55000,
ending:685000
},
{
name:"Investor B",
commitment:850000,
contribution:600000,
distribution:90000,
nii:-15000,
ending:495000
},
{
name:"Investor C",
commitment:1200000,
contribution:820000,
distribution:150000,
nii:90000,
ending:760000
},
{
name:"Investor D",
commitment:680000,
contribution:510000,
distribution:45000,
nii:28000,
ending:493000
},
{
name:"Investor E",
commitment:970000,
contribution:700000,
distribution:100000,
nii:42000,
ending:642000
},
{
name:"Investor F",
commitment:1400000,
contribution:980000,
distribution:260000,
nii:110000,
ending:830000
},
{
name:"Investor G",
commitment:720000,
contribution:510000,
distribution:80000,
nii:-20000,
ending:410000
},
{
name:"Investor H",
commitment:1060000,
contribution:800000,
distribution:185000,
nii:64000,
ending:679000
},
{
name:"Investor I",
commitment:900000,
contribution:630000,
distribution:130000,
nii:18000,
ending:518000
},
{
name:"Investor J",
commitment:1500000,
contribution:1100000,
distribution:210000,
nii:125000,
ending:1015000
}
];

const investorSelect = document.getElementById("investor");

investors.forEach((x)=>{
    investorSelect.innerHTML +=
    `<option>${x.name}</option>`;
});

function format(v){
    return "$" + v.toLocaleString();
}

function updateDashboard(){

    const inv = investors.find(
        x => x.name === investorSelect.value
    );

    document.getElementById("commitment").innerHTML =
      `<option>${format(inv.commitment)}</option>`;

    document.getElementById("contribution").innerHTML =
      `<option>${format(inv.contribution)}</option>`;

    document.getElementById("distribution").innerHTML =
      `<option>${format(inv.distribution)}</option>`;

    document.getElementById("nii").innerHTML =
      `<option>${format(inv.nii)}</option>`;

    document.getElementById("endingBalance").innerHTML =
      `<option>${format(inv.ending)}</option>`;

    document.getElementById("kpiCommitment").innerText =
      format(inv.commitment);

    document.getElementById("kpiContribution").innerText =
      format(inv.contribution);

    document.getElementById("kpiDistribution").innerText =
      format(inv.distribution);

    document.getElementById("kpiNII").innerText =
      format(inv.nii);

    document.getElementById("kpiEnding").innerText =
      format(inv.ending);
}

let rows="";

investors.forEach(x=>{
rows += `
<tr>
<td>${x.name}</td>
<td>${format(x.commitment)}</td>
<td>${format(x.contribution)}</td>
<td>${format(x.distribution)}</td>
<td>${format(x.nii)}</td>
<td>${format(x.ending)}</td>
</tr>
`;
});

document.getElementById("tableData").innerHTML=rows;

investorSelect.addEventListener("change",updateDashboard);

updateDashboard();

</script>

</body>
</html>
